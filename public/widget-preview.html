<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Web chat widget preview</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #f3f4f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .lvx-preview-hint {
    position: absolute;
    top: 16px;
    left: 16px;
    right: 16px;
    font-size: 13px;
    color: #6b7280;
    text-align: center;
  }
  .lvx-preview-missing {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    font-size: 13px;
    color: #9ca3af;
    text-align: center;
    padding: 0 24px;
  }
</style>
</head>
<body>
<div class="lvx-preview-hint">This is a live preview - click the chat bubble to try it.</div>
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var businessId = params.get("business");
    if (!businessId) {
      document.body.innerHTML = '<div class="lvx-preview-missing">No business selected yet.</div>';
      return;
    }
    var script = document.createElement("script");
    script.src = "/lanavix-widget.js";
    script.setAttribute("data-business", businessId);
    script.async = true;
    document.body.appendChild(script);
  })();
</script>
</body>
</html>
